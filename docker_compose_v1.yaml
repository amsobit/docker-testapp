services:

  app:
    build: .
    container_name: amsobit-testapp
    ports:
      - "5050:5050"
    environment:
      - PORT=5050
    depends_on:
      - mongo
    networks:
    - mongo-network

  mongo:
    image: mongo
    container_name: mongo
    ports:
    - "27017:27017"
    environment:
    - MONGO_INITDB_ROOT_USERNAME=${dbUser}
    - MONGO_INITDB_ROOT_PASSWORD=${dbPass}   
    networks:
    - mongo-network
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    ports:
    - "8081:8081"
    environment:
    - ME_CONFIG_MONGODB_ADMINUSERNAME=${dbUser}
    - ME_CONFIG_MONGODB_ADMINPASSWORD=${dbPass}
    - ME_CONFIG_MONGODB_URL=mongodb://${dbUser}:${dbPass}@mongo:27017
    depends_on:
    - mongo
    networks:
    - mongo-network

networks:
 mongo-network:
  driver: bridge

volumes:
  mongo_data: